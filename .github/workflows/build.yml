name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crear proyecto Android
        run: |
          set -e
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
           namespace 'com.launcher.dd'
           compileSdk 34
           defaultConfig { applicationId 'com.launcher.dd'; minSdk 24; targetSdk 30; versionCode 1; versionName '1.0' }
           buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
           compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
           kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies { implementation 'org.osmdroid:osmdroid-android:6.1.18' }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
           <uses-permission android:name="android.permission.INTERNET"/>
           <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
           <queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>
           <application android:label="Launcher DD" android:hardwareAccelerated="true" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
            <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:screenOrientation="landscape" android:resizeableActivity="true"
             android:configChanges="orientation|screenSize|keyboardHidden">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/launcher/dd/MainActivity.kt')"
          cat > 'app/src/main/java/com/launcher/dd/MainActivity.kt' <<'EOF_FILE'
          package com.launcher.dd
          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.*
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import org.json.JSONObject
          import org.osmdroid.config.Configuration
          import org.osmdroid.tileprovider.tilesource.TileSourceFactory
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Polyline
          import org.osmdroid.views.overlay.mylocation.GpsMyLocationProvider
          import org.osmdroid.views.overlay.mylocation.MyLocationNewOverlay
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : Activity(), LocationListener {
              private lateinit var speed: SpeedView; private lateinit var road: RoadView; private lateinit var map: MapView
              private val track = Polyline(); private var lastW = 0L
              private var freq = 106.2f
              private val prefs by lazy { getSharedPreferences("slots", MODE_PRIVATE) }
              private val radioPkgs = listOf("com.syu.radio", "com.microntek.radio", "com.android.fmradio", "com.mediatek.fmradio", "com.hct.radio", "com.qualcomm.fmradio")

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Configuration.getInstance().userAgentValue = packageName
                  setContentView(R.layout.activity_main)
                  speed = SpeedView(this); road = RoadView(this); map = MapView(this)
                  findViewById<FrameLayout>(R.id.speedBox).addView(speed)
                  findViewById<FrameLayout>(R.id.roadBox).addView(road)
                  findViewById<FrameLayout>(R.id.mapBox).addView(map)
                  map.setTileSource(TileSourceFactory.MAPNIK); map.setMultiTouchControls(true); map.controller.setZoom(17.0)
                  track.outlinePaint.color = 0xFF2979FF.toInt(); track.outlinePaint.strokeWidth = 12f
                  map.overlays.add(track)
                  map.overlays.add(MyLocationNewOverlay(GpsMyLocationProvider(this), map).apply { enableMyLocation(); enableFollowLocation() })
                  buildBigButtons(); buildDock(); setupRadio()
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) startGps()
                  else requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 1)
              }
              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) { if (g.isNotEmpty() && g[0] == 0) startGps() }
              private fun startGps() {
                  val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  try { lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 0f, this) } catch (_: SecurityException) {}
              }
              override fun onLocationChanged(l: Location) {
                  val kmh = if (l.hasSpeed()) l.speed * 3.6f else 0f
                  val v = if (kmh < 2f) 0f else kmh
                  speed.setSpeed(v); road.setSpeed(v)
                  val gp = GeoPoint(l.latitude, l.longitude)
                  if (v > 0) track.addPoint(gp)
                  map.controller.animateTo(gp)
                  if (System.currentTimeMillis() - lastW > 15 * 60_000L) { lastW = System.currentTimeMillis(); loadWeather(l.latitude, l.longitude) }
              }
              private fun loadWeather(la: Double, lo: Double) = thread {
                  try {
                      val u = "https://api.open-meteo.com/v1/forecast?latitude=$la&longitude=$lo&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset&forecast_days=5&timezone=auto"
                      val j = JSONObject(URL(u).readText()); val c = j.getJSONObject("current"); val d = j.getJSONObject("daily")
                      val city = try { Geocoder(this).getFromLocation(la, lo, 1)?.firstOrNull()?.locality ?: "" } catch (_: Exception) { "" }
                      val days = d.getJSONArray("time"); val mx = d.getJSONArray("temperature_2m_max"); val mn = d.getJSONArray("temperature_2m_min"); val wc = d.getJSONArray("weather_code")
                      val fc = (0 until days.length()).joinToString("   ") { "${days.getString(it).takeLast(5)} ${icon(wc.getInt(it))} ${mx.getDouble(it).toInt()}°/${mn.getDouble(it).toInt()}°" }
                      runOnUiThread {
                          findViewById<TextView>(R.id.tvCity).text = "📍 $city"
                          findViewById<TextView>(R.id.tvTemp).text = "${c.getDouble("temperature_2m").toInt()}°C ${icon(c.getInt("weather_code"))}"
                          findViewById<TextView>(R.id.tvInfo).text = "Sensación: ${c.getDouble("apparent_temperature").toInt()}°  Viento: ${c.getDouble("wind_speed_10m").toInt()} km/h\n☀ ${d.getJSONArray("sunrise").getString(0).takeLast(5)}  🌙 ${d.getJSONArray("sunset").getString(0).takeLast(5)}"
                          findViewById<TextView>(R.id.tvForecast).text = fc
                      }
                  } catch (_: Exception) { lastW = 0 }
              }
              private fun icon(c: Int) = when { c == 0 -> "☀️"; c < 4 -> "⛅"; c < 50 -> "🌫"; c < 70 -> "🌧"; c < 80 -> "❄️"; c < 90 -> "🌦"; else -> "⛈" }

              private fun bigBtn(ic: Int, onClick: () -> Unit) = ImageView(this).apply {
                  setImageResource(ic); setBackgroundResource(R.drawable.big_btn); setPadding(40, 40, 40, 40); setOnClickListener { onClick() }
                  layoutParams = GridLayout.LayoutParams(GridLayout.spec(GridLayout.UNDEFINED, 1f), GridLayout.spec(GridLayout.UNDEFINED, 1f)).apply { width = 0; height = 0; setMargins(6, 6, 6, 6) }
              }
              private fun buildBigButtons() {
                  val g = findViewById<GridLayout>(R.id.bigGrid)
                  g.addView(bigBtn(R.drawable.ic_bt) { startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS)) })
                  g.addView(bigBtn(R.drawable.ic_car) { startActivity(Intent(Settings.ACTION_SOUND_SETTINGS)) })
                  g.addView(bigBtn(R.drawable.ic_tools) { startActivity(Intent(Settings.ACTION_SETTINGS)) })
                  g.addView(bigBtn(R.drawable.ic_wifi) { startActivity(Intent(Settings.ACTION_WIFI_SETTINGS)) })
              }
              private fun buildDock() {
                  val dock = findViewById<LinearLayout>(R.id.dock); dock.removeAllViews()
                  for (i in 0 until 5) dock.addView(ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f).apply { setMargins(10, 8, 10, 8) }; setPadding(14, 14, 14, 14); setBackgroundResource(R.drawable.slot)
                      refreshSlot(this, i)
                      setOnClickListener { val p = prefs.getString("s$i", null); if (p == null) pick(i, this) else packageManager.getLaunchIntentForPackage(p)?.let { startActivity(it) } }
                      setOnLongClickListener { pick(i, this); true }
                  })
                  dock.addView(TextView(this).apply { text = "⠿"; textSize = 30f; gravity = Gravity.CENTER; setTextColor(-1)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f); setOnClickListener { pick(-1, null) } })
              }
              private fun refreshSlot(v: ImageView, i: Int) {
                  val p = prefs.getString("s$i", null)
                  try { if (p != null) v.setImageDrawable(packageManager.getApplicationIcon(p)) else v.setImageResource(android.R.drawable.ic_input_add) } catch (_: Exception) { v.setImageResource(android.R.drawable.ic_input_add) }
              }
              private fun pick(slot: Int, v: ImageView?) {
                  val apps = packageManager.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0).sortedBy { it.loadLabel(packageManager).toString().lowercase() }
                  val names = apps.map { it.loadLabel(packageManager).toString() }.toTypedArray()
                  AlertDialog.Builder(this).setTitle(if (slot < 0) "Aplicaciones" else "Elegir app").setItems(names) { _, w ->
                      val pkg = apps[w].activityInfo.packageName
                      if (slot < 0) packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }
                      else { prefs.edit().putString("s$slot", pkg).apply(); v?.let { refreshSlot(it, slot) } }
                  }.show()
              }
              private fun setupRadio() {
                  val tv = findViewById<TextView>(R.id.tvFreq)
                  findViewById<Button>(R.id.fPrev).setOnClickListener { freq = (freq - 0.1f).coerceAtLeast(87.5f); tv.text = "%.1f".format(freq) }
                  findViewById<Button>(R.id.fNext).setOnClickListener { freq = (freq + 0.1f).coerceAtMost(108f); tv.text = "%.1f".format(freq) }
                  findViewById<Button>(R.id.fRadio).setOnClickListener {
                      radioPkgs.firstNotNullOfOrNull { packageManager.getLaunchIntentForPackage(it) }?.let { startActivity(it) }
                          ?: Toast.makeText(this, "No se encontró la app de radio del equipo", Toast.LENGTH_LONG).show()
                  }
              }
              override fun onResume() { super.onResume(); map.onResume() }
              override fun onPause() { super.onPause(); map.onPause() }
              override fun onBackPressed() {}
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/launcher/dd/Views.kt')"
          cat > 'app/src/main/java/com/launcher/dd/Views.kt' <<'EOF_FILE'
          package com.launcher.dd
          import android.content.Context
          import android.graphics.*
          import android.view.View

          class SpeedView(c: Context) : View(c) {
              private var shown = 0f; private var target = 0f
              private val arc = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 26f; strokeCap = Paint.Cap.ROUND }
              private val bg = Paint(arc).apply { color = 0x3300E5FF }
              private val num = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF22D3FF.toInt(); textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD }
              private val unit = Paint(num).apply { typeface = Typeface.DEFAULT }
              private val r = RectF()
              fun setSpeed(kmh: Float) { target = kmh; postInvalidateOnAnimation() }
              override fun onDraw(cv: Canvas) {
                  shown += (target - shown) * 0.15f
                  val s = minOf(width, height).toFloat(); val m = 30f
                  r.set(width / 2f - s / 2 + m, height / 2f - s / 2 + m, width / 2f + s / 2 - m, height / 2f + s / 2 - m)
                  arc.shader = SweepGradient(width / 2f, height / 2f, intArrayOf(0xFF00E5FF.toInt(), 0xFF3D5AFE.toInt(), 0xFFFF2DAA.toInt()), null)
                  cv.drawArc(r, 135f, 270f, false, bg)
                  cv.drawArc(r, 135f, 270f * (shown / 220f).coerceIn(0f, 1f), false, arc)
                  num.textSize = s * 0.38f; unit.textSize = s * 0.1f
                  cv.drawText(shown.toInt().toString(), width / 2f, height / 2f + s * 0.12f, num)
                  cv.drawText("km/h", width / 2f, height / 2f + s * 0.28f, unit)
                  if (Math.abs(target - shown) > 0.5f) postInvalidateOnAnimation()
              }
          }

          class RoadView(c: Context) : View(c) {
              private var speed = 0f; private var off = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG); private val path = Path(); private val rr = RectF()
              fun setSpeed(kmh: Float) { speed = kmh; postInvalidateOnAnimation() }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val cx = w / 2
                  p.color = 0xFF5BBF3A.toInt(); cv.drawRect(0f, 0f, w, h, p)
                  path.reset(); path.moveTo(cx - 8, 0f); path.lineTo(cx + 8, 0f); path.lineTo(w * .85f, h); path.lineTo(w * .15f, h); path.close()
                  p.color = 0xFF555555.toInt(); cv.drawPath(path, p)
                  off = (off + speed * 0.12f) % 80f
                  p.color = Color.WHITE; p.strokeWidth = 5f
                  var y = off - 80f
                  while (y < h) { cv.drawLine(cx, y, cx, y + 40f, p); y += 80f }
                  val shake = if (speed > 1) Math.sin(System.nanoTime() / 6e7).toFloat() * 2f else 0f
                  p.color = 0xFFF5A623.toInt(); rr.set(cx - 26 + shake, h * .6f, cx + 26 + shake, h * .6f + 100)
                  cv.drawRoundRect(rr, 16f, 16f, p)
                  p.color = 0xFF222222.toInt(); rr.set(cx - 20 + shake, h * .6f + 25, cx + 20 + shake, h * .6f + 50); cv.drawRoundRect(rr, 8f, 8f, p)
                  if (speed > 1) postInvalidateOnAnimation()
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/bg_main.xml')"
          cat > 'app/src/main/res/drawable/bg_main.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:type="radial" android:gradientRadius="900dp" android:centerX="0.5" android:centerY="0.4" android:startColor="#2A1670" android:endColor="#050520"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/big_btn.xml')"
          cat > 'app/src/main/res/drawable/big_btn.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#050B22"/><stroke android:width="3dp" android:color="#22D3FF"/><corners android:radius="28dp"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/dock.xml')"
          cat > 'app/src/main/res/drawable/dock.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0A1A4A"/><stroke android:width="2dp" android:color="#22D3FF"/><corners android:radius="36dp"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_bt.xml')"
          cat > 'app/src/main/res/drawable/ic_bt.xml' <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M7,7L17,17L12,22V2L17,7L7,17"/></vector>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_car.xml')"
          cat > 'app/src/main/res/drawable/ic_car.xml' <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M5,11L6.5,6.5H17.5L19,11V18H17V16H7V18H5Z"/><path android:fillColor="#050B22" android:pathData="M7.5,10H16.5L15.6,7.8H8.4Z"/></vector>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_tools.xml')"
          cat > 'app/src/main/res/drawable/ic_tools.xml' <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M4,20L14,10M20,20L10,10M15,3L21,9M9,3L3,9"/></vector>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_wifi.xml')"
          cat > 'app/src/main/res/drawable/ic_wifi.xml' <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M3,10Q12,1 21,10M6,13.5Q12,8 18,13.5M9,17Q12,14.5 15,17"/><path android:fillColor="#FFFFFF" android:pathData="M12,18.2m-1.4,0a1.4,1.4 0 1,0 2.8,0a1.4,1.4 0 1,0 -2.8,0"/></vector>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/panel.xml')"
          cat > 'app/src/main/res/drawable/panel.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#CC0B1236"/><stroke android:width="2dp" android:color="#22D3FF"/><corners android:radius="16dp"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/panel_black.xml')"
          cat > 'app/src/main/res/drawable/panel_black.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/><stroke android:width="2dp" android:color="#1E5FA8"/><corners android:radius="4dp"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/drawable/slot.xml')"
          cat > 'app/src/main/res/drawable/slot.xml' <<'EOF_FILE'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#050B22"/><stroke android:width="2dp" android:color="#1E90FF"/><corners android:radius="14dp"/></shape>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/layout/activity_main.xml')"
          cat > 'app/src/main/res/layout/activity_main.xml' <<'EOF_FILE'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@drawable/bg_main">
           <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
            <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical" android:padding="6dp">
             <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:background="@drawable/panel" android:padding="10dp">
              <TextView android:id="@+id/tvCity" android:textColor="#FFF" android:textSize="16sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextClock android:format12Hour="EEEE - MMM d" android:format24Hour="EEEE - MMM d" android:textColor="#FFF" android:textSize="14sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
               <TextClock android:format12Hour="h:mm a" android:format24Hour="HH:mm" android:textColor="#FFF" android:textSize="44sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
               <TextView android:id="@+id/tvTemp" android:text="--°C" android:gravity="end" android:textColor="#FFF" android:textSize="30sp" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
              </LinearLayout>
              <TextView android:id="@+id/tvInfo" android:textColor="#CFE" android:textSize="12sp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/tvForecast" android:textColor="#FFF" android:textSize="12sp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
             </LinearLayout>
             <FrameLayout android:id="@+id/mapBox" android:background="@drawable/panel" android:padding="4dp" android:layout_marginTop="6dp" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1.2"/>
            </LinearLayout>
            <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
             <FrameLayout android:id="@+id/speedBox" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1.2"/>
             <FrameLayout android:id="@+id/roadBox" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/>
            </LinearLayout>
            <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical" android:padding="6dp">
             <LinearLayout android:id="@+id/radioPanel" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:background="@drawable/panel_black" android:gravity="center">
              <TextView android:id="@+id/tvFreq" android:text="106.2" android:textColor="#FFF" android:textSize="40sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
               <Button android:id="@+id/fPrev" android:text="◀" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
               <Button android:id="@+id/fRadio" android:text="FM" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
               <Button android:id="@+id/fNext" android:text="▶" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
              </LinearLayout>
             </LinearLayout>
             <GridLayout android:id="@+id/bigGrid" android:columnCount="2" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1.4"/>
            </LinearLayout>
           </LinearLayout>
           <LinearLayout android:id="@+id/dock" android:layout_width="match_parent" android:layout_height="72dp" android:orientation="horizontal" android:gravity="center" android:background="@drawable/dock" android:paddingStart="16dp" android:paddingEnd="16dp"/>
          </LinearLayout>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_FILE'
          <resources><string name="app_name">Launcher DD</string></resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.2.2' apply false
           id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include(":app")
          EOF_FILE
          ls -R app | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Aceptar licencias Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherDD-apk
          path: app/build/outputs/apk/debug/*.apk
